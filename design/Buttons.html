<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Buttons</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Bricolage Grotesque", "Avenir Next", sans-serif;
        background: #ffffff;
        color: #161616;
      }
    </style>
  </head>
  <body>
    <div
      style="
        width: 1280px;
        height: 460px;
        box-sizing: border-box;
        padding: 40px 56px;
        display: grid;
        grid-template-columns: 200px repeat(3, minmax(0, 1fr));
        align-items: center;
        align-content: start;
        gap: 22px 40px;
        background: #ffffff;
        color: #161616;
      "
    >
      <span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
          color: #4d4a44;
        "
      ></span
      ><span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
          color: #4d4a44;
        "
        >DEFAULT</span
      ><span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
          color: #4d4a44;
        "
        >OPEN · YOURS</span
      ><span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
          color: #4d4a44;
        "
        >DISABLED</span
      >
      <span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
        "
        >TEXT BUTTON</span
      >
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          style="
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 16px;
            border: 3px solid #161616;
            border-radius: 10px;
            font:
              700 16px &quot;Bricolage Grotesque&quot;,
              sans-serif;
            background: #ffffff;
            box-shadow:
              inset 0 0 0 2px #ffffff,
              inset 0 0 0 4px #161616;
            color: #161616;
            cursor: pointer;
          "
        >
          Button
        </button>
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          style="
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 16px;
            border: 3px solid #161616;
            border-radius: 10px;
            font:
              700 16px &quot;Bricolage Grotesque&quot;,
              sans-serif;
            background: #8fe3c0;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #161616;
            cursor: pointer;
          "
        >
          Button
        </button>
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          disabled
          style="
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 16px;
            border: 3px solid #161616;
            border-radius: 10px;
            font:
              700 16px &quot;Bricolage Grotesque&quot;,
              sans-serif;
            background: #f1efe9;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #4d4a44;
            cursor: not-allowed;
          "
        >
          Button
        </button>
      </div>
      <span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
        "
        >PRIMARY</span
      >
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          style="
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 16px;
            border: 3px solid #161616;
            border-radius: 10px;
            font:
              700 16px &quot;Bricolage Grotesque&quot;,
              sans-serif;
            background: #9b1d55;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #ffffff;
            cursor: pointer;
          "
        >
          Create
        </button>
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <span
          style="
            font:
              500 13px &quot;IBM Plex Mono&quot;,
              monospace;
            color: #4d4a44;
          "
          >—</span
        >
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          disabled
          style="
            display: flex;
            align-items: center;
            height: 44px;
            padding: 0 16px;
            border: 3px solid #161616;
            border-radius: 10px;
            font:
              700 16px &quot;Bricolage Grotesque&quot;,
              sans-serif;
            background: #f1efe9;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #4d4a44;
            cursor: not-allowed;
          "
        >
          Create
        </button>
      </div>
      <span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
        "
        >ICON BUTTON</span
      >
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          aria-label="Add channel"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 2px solid #161616;
            border-radius: 8px;
            background: #ffffff;
            box-shadow:
              inset 0 0 0 2px #ffffff,
              inset 0 0 0 4px #161616;
            color: #161616;
            cursor: pointer;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          aria-label="Add channel"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 2px solid #161616;
            border-radius: 8px;
            background: #8fe3c0;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #161616;
            cursor: pointer;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          aria-label="Add channel"
          disabled
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 2px solid #161616;
            border-radius: 8px;
            background: #f1efe9;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #4d4a44;
            cursor: not-allowed;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      </div>
      <span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
        "
        >SEND</span
      >
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          aria-label="Send"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 2px solid #161616;
            border-radius: 8px;
            background: #9b1d55;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #ffffff;
            cursor: pointer;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 3 3 10.5l7.5 3L21 3z"></path>
            <path d="M21 3l-7.5 18-3-7.5"></path>
          </svg>
        </button>
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <span
          style="
            font:
              500 13px &quot;IBM Plex Mono&quot;,
              monospace;
            color: #4d4a44;
          "
          >—</span
        >
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          aria-label="Send"
          disabled
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: 2px solid #161616;
            border-radius: 8px;
            background: #f1efe9;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #4d4a44;
            cursor: not-allowed;
          "
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 3 3 10.5l7.5 3L21 3z"></path>
            <path d="M21 3l-7.5 18-3-7.5"></path>
          </svg>
        </button>
      </div>
      <span
        style="
          font:
            600 12px &quot;IBM Plex Mono&quot;,
            monospace;
          letter-spacing: 0.06em;
        "
        >REACTION</span
      >
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          aria-pressed="false"
          style="
            display: flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 12px;
            border: 2px solid #161616;
            border-radius: 16px;
            font:
              600 13px &quot;IBM Plex Mono&quot;,
              monospace;
            background: #ffffff;
            color: #161616;
            cursor: pointer;
          "
        >
          ❤️ 1
        </button>
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          aria-pressed="true"
          style="
            display: flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 12px;
            border: 2px solid #161616;
            border-radius: 16px;
            font:
              600 13px &quot;IBM Plex Mono&quot;,
              monospace;
            background: #8fe3c0;
            color: #161616;
            cursor: pointer;
          "
        >
          👍 2
        </button>
      </div>
      <div style="display: flex; align-items: center; min-height: 44px">
        <button
          type="button"
          disabled
          style="
            display: flex;
            align-items: center;
            gap: 6px;
            height: 32px;
            padding: 0 12px;
            border: 2px solid #161616;
            border-radius: 16px;
            font:
              600 13px &quot;IBM Plex Mono&quot;,
              monospace;
            box-shadow: inset 0 0 0 2px #ffffff;
            background: #f1efe9;
            box-shadow: inset 0 0 0 2px #ffffff;
            color: #4d4a44;
            cursor: not-allowed;
          "
        >
          ❤️ 1
        </button>
      </div>
    </div>
  </body>
</html>
