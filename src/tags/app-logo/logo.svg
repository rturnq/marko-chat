<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 20" width="28" height="20">
  <!--
    Four bars, 4 wide with round ends, each in its light shade above a V that
    runs from the top corners down to the middle, and its dark shade below.
    Drawn as plain shapes: a clip-path would be simpler, but Safari blurs one
    in an image. Each dark shape reaches 0.5 up under its light one, so no
    seam shows between them.
  -->
